<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gemini 3.8">
  <title>Gemini Mobile Gateway</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <div class="status-indicator"></div>
      <select id="model-select" class="model-select">
        <option value="gemini-3.8-flash" selected>3.8 Flash (Целевая)</option>
        <option value="gemini-3.5-flash-lite">3.5 Flash Lite (Быстрая)</option>
        <option value="gemini-3.1-flash-lite">3.1 Flash Lite</option>
        <option value="gemini-3.1-pro-preview">3.1 Pro (Рассуждения)</option>
        <option value="gemini-3-flash-preview">3 Flash Preview</option>
      </select>
    </div>

    <div class="header-actions">
      <button id="search-toggle-btn" class="icon-button" title="Поиск Google">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </button>
      <button id="clear-btn" class="icon-button" title="Очистить диалог">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="chat-container" class="chat-container">
    <div class="message system-message">
      <div class="message-content">
        Сервер настроен на Gemini 3.8 Flash с дозвоном. Переключить модель можно в выпадающем меню сверху.
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div id="attachments-bar" class="attachments-bar" style="display: none;"></div>

    <form id="chat-form" class="chat-form">
      <input type="file" id="file-input" multiple style="display: none;">

      <button type="button" id="attach-btn" class="icon-button attach-btn" title="Прикрепить файл">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
        </svg>
      </button>

      <textarea 
        id="prompt-input" 
        class="chat-input" 
        placeholder="Задайте вопрос..." 
        rows="1" 
        maxlength="16000"
      ></textarea>

      <button type="submit" id="send-btn" class="send-button" title="Отправить сообщение">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </footer>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
